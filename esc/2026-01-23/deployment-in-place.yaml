apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
    type: front-end
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        app: my-app
        type: front-end
    spec:
      containers:
      - name: my-app
        image: nginx
        resizePolicy:
        - resourceName: cpu
          restartpolicy: NotRequired
        - resourceName: memory
          restartpolicy: NotRequired
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
  replicas: 1
  selector:
    matchLabels:
      type: front-end